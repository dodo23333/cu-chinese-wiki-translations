    ┃获取：<color=#aaaaaa>医疗箱/制作(10智力?)</color>
    ┃制作(10)：2废料板+1电线捆+1塑料块+1废料管+1钉子+1(可捶打)
    <color=#ffaa00>提示：默认含50mL血清。是正式版L.R.D.的下位替代，制作简单。</color>
  lrd: （LRD）
  lrddsc: |-
    ┃外敷：
    ┃<color=#88ff88>肌肉 +50(相邻肢体+40)</color>
    ┃感染 <color=#88ff88>-10(相邻肢体-5)</color>
    ┃<color=#88ff88>消毒 10分钟(相邻肢体5分钟)</color>
    ┃出血 <color=#88ff88>-30%(相邻肢体-25%)</color>
    ┃阿片类水平 35
    ┃内出血(仅胸部) <color=#88ff88>-55%</color>
