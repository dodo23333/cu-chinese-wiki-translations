    <color=#888888>初始血量：</color><color=#88ff88>200</color>
    <color=#ffaa00>玩家经过时可能掉落，造成皮肤/肌肉伤和单肢出血，伤害随速度增加。
    可提前打掉或引诱掉落来排除。
    注意头部！被砸会遭受重创，但不致死。</color>
  icestalactitedsc: |-
    <color=#888888>初始血量：</color><color=#88ff88>200</color>
    <color=#ffaa00>玩家经过时可能掉落，造成皮肤/肌肉伤和单肢出血，伤害随速度增加。
    可提前打掉或引诱掉落来排除。
    注意头部！被砸会遭受重创，但不致死。</color>
  stalactitedscdropped: |-
    它变得安全了。
    除了有点挡道外，它和普通石头没什么两样。
  drybushdsc: |-
    <color=#888888>破坏掉落：</color>
    <color=#aaaaaa>干燥纤维x1-2 (90%)、干燥纤维 (60%)、干燥纤维 (40%)</color>
    <color=#888888>初始血量：</color><color=#88ff88>100</color>
    <color=#ffaa00>内部大幅减速，可利用来缓冲高空坠落。
    其大体积可遮盖地雷等陷阱，进入前需检查。</color>
  brownshroomdsc: |-
    <color=#888888>破坏掉落：</color>
    <color=#aaaaaa>棕色菌盖 (80-100%)</color>
    <color=#888888>初始血量：</color><color=#88ff88>50</color>
  spentfueldsc: |-
    <color=#888888>初始血量：</color><color=#88ff88>20000</color>
    <color=#ffaa00>接近时受到辐射，紧贴时高达+1.8 Gy/s。
    HP极高无法被摧毁，需绕行或快速通过。</color>
  radbarreldsc: |-
    <color=#888888>破坏掉落：</color>
    <color=#aaaaaa>废金属x1-2 (50%)、废金属x1-2 (25%)</color>
    <color=#888888>初始血量：</color><color=#88ff88>2000</color>
    <color=#ffaa00>靠近积累辐射，紧贴约+1.25Gy/s。
    比衰变燃料弱，可被推动或炸药摧毁。
    快速通过或绕行可减少辐射危害。</color>
  soundcannondsc: |-
    <color=#888888>初始血量：</color><color=#88ff88>1500</color>
    <color=#888888>破坏掉落：</color><color=#aaaaaa>金属废料1~2(80%)、金属废料(40%)、电路板(50%)</color>
    <color=#ff4444>触发条件：可见玩家，距离 < 50，5秒充能后发射：
    头部疼痛设为80/其他40┃听力-60%┃全肢肌肉20-30伤┃内出血0.17~0.26L/m┃意识-69%┃脑伤5┃心情-2┃呼吸归零┃击退瘫倒┃静音30秒┃100肾上腺素┃鱼眼效果┃仅发射一次</color>

    <color=#ff4444>水下被命中效果倍增：听力-100%┃内出血0.86L/m┃脑伤20┃心情-10┃头部疼痛设为100┃静音2分钟┃被击入液体几乎必死┃</color>
    阻挡：躲墙后意识仅-30%┃静音4秒┃玩家与炮台浸没状态不同时视为阻挡。
    <color=#ffaa00>建议听到充能声立即躲墙后，或快速搭2~3格废料墙。潜水可挡(前提炮台不在水中)。命中音效极响，调低音量！</color>
  traderdsc: |-
    允许和他进行交易。
    <color=#888888>属性：</color><color=#aaaaaa>生命 Exp 1000/Mil 900/沙丘 1250</color>
    <color=#888888>掉落：</color><color=#aaaaaa>黄色肉块x4、内脏(各100%)</color>
    <color=#888888>交互：</color><color=#aaaaaa>交易、讨价、拥抱、威胁、休息、要求移动</color>
    <color=#ffaa00>流血时相遇赠免费绷带。
    破坏附近灯泡-40声望。
    杀死致心情-10、创伤+30、生病+30。</color>
  bananaplantdsc: |-
    <color=#888888>破坏掉落：</color>
    <color=#aaaaaa>植物纤维x1-2 (20%)</color>
    <color=#888888>初始血量：</color><color=#88ff88>150</color>
    <color=#ffaa00>踩上会滑倒并强制瘫倒，水平速度x1.4(脚部x1.9)。
    受速度影响，缓慢走过去不会有问题，速度快时可致死。</color>
  geyserdsc: |-
    <color=#888888>初始血量：</color><color=#88ff88>250</color>
    <color=#ffaa00>接触触发喷涌，射出地下水或荧光藻，冲走附近物体。
    冷却10秒后可重新触发。可投掷物品触发后安全通过。
    小心被冲击导致动弹不得，和瘫痪一样，随着水流坠落底层。</color>
  oilpipedsc: |-
    <color=#888888>初始血量：</color><color=#88ff88>500</color>
    <color=#ffaa00>被动产生原油淹没区域。离开后停止产油。
    可用炸药摧毁。原油可用于缓慢下降减少坠落伤害，但可能瘫倒受伤。
    原油会导致身体肮脏、行动迟缓，因此尽快离开。</color>
  popdsc: |-
    <color=#888888>破坏掉落：</color>
    <color=#aaaaaa>盖格果x1-2 (50%)、盖格果 (25%)、摔炮果苞叶x1-3 (50%)、摔炮果苞叶 (25%)、地狱菜叶x0-2 (50%)、干燥纤维 (100%)</color>
    <color=#888888>初始血量：</color><color=#88ff88>150</color>
    <color=#ffaa00>废土层宝贵资源：果实可充饥解渴、地狱菜叶减内出血、摔炮果苞叶可作临时绷带镇痛。</color>
