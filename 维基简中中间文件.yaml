  looatmountdsc: |-
    所有战利品的生成占比

    影响每层战利品生成数量，如空投舱，物资箱等在每层刷新生成

    数值过高可能导致性能异常
  trapamountdsc: |-
    所有陷阱的生成占比

    该设置会影响游戏中生成的陷阱总数，如钉刺陷阱、敌人等在每层刷新生成

    数值过高可能导致性能异常
  lootdepthmultiplierdsc: |-
    该设置为战利品数量倍率，每穿过一层地图，战利品的生成数量都会乘以这个倍率

    也就是说，如将其设为50%，每向下一层，战利品数量将会减半
  trapdepthincreasedsc: |-
    该设置为陷阱数量增量值，每穿过一层地图，当前地层的陷阱生成数量都会加上这个数值

    也就是说，如将其设为50%，陷阱的生成占比会从100%开始，逐层增加至150%、200%、250%以此类推
  radlinedisabledsc: 开启后，禁用每层时间限制
  unchippeddsc: |-
    该设置开启后，将禁用你的健康芯片功能，你需要投入更多精力，去排查和应对场景中无处不在的危险

    不建议新手使用，不过该效果仍有可能在游戏内罕见出现，以地层修饰符的形式随机生成
