    <color=#ffaa00>特点：游戏中皮肤恢复量最高的物品，同时具备消毒效果。</color>
  sterilizedbandagedsc: |-
    ┃每一圈(共12圈)：
    ┃<color=#88ff88>皮肤 +2.5</color>
    ┃骨折 <color=#88ff88>-1.67%</color>
    ┃脱臼 <color=#88ff88>-1.67%</color>
