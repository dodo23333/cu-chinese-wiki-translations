    ┃获取：<color=#aaaaaa>医疗箱/制作(15智力?)</color>
    ┃制作(15)：1临时LRD+2钛板+25mL生化流体+1自动注射器+1电路板(>=90%)+1电线捆+1(可切割)+1(可捶打)
    <color=#ffaa00>提示：默认含75mL血清。清空后重量降至0.10u，建议将血清单独存放以减轻负重。</color>
