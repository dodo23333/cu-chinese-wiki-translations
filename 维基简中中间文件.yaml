    注射精度有限，极易过量，建议进一步稀释后使用。交易价值极高。切勿饮用！</color>
  painkillersdsc: |-
    ┃获取：<color=#aaaaaa>医疗箱/空投舱/生命舱箱子/交易/尸体</color>
    ┃制作(10)：1镇痛晶碎片+1塑料块+20mL生化流体+50mL水=200mL止痛药
  braingrowdsc: ┃获取：<color=#aaaaaa>医疗箱/物资箱/交易/尸体</color>
  autopumpdsc: |-
    ┃使用效果：
    ┃<color=#88FF88>穿戴且有电时:若血压<85，则血压+44</color>
    ┃<color=#aaaaaa>穿戴时每秒消耗0.083%电量，每次抬升血压消耗0.2%电量</color>
    ┃<color=#88ff88>心脏停搏时中电池满电最少可用7分20秒</color>
    ┃获取：<color=#aaaaaa>医疗箱/生命舱箱子/空投舱/交易</color>
    ┃机制：激活期间玩家不会因失血、心脏停搏等导致的低血压而昏迷。不能唤醒已昏迷者，不能维持意识和大脑健康。极端温度、饥饿等直接损伤头部肌肉或大脑的威胁不受保护。
    <color=#ffaa00>冷知识：新版本激活时血容低仍可致死，因此尽量保证血容量不要太低。</color>
  aeddsc: |-
    ┃对上半身使用：
    ┃<color=#ff4444>皮肤 -5</color>
    ┃疼痛 +20
    ┃获取：<color=#aaaaaa>生命舱/生命舱箱子/空投舱/医疗箱/交易</color>
    <color=#ffaa00>电击有20%几率修复心脏骤停，
    可多次尝试。低功率即可，以省电。</color>
  manualdefibrillatordsc: |-
