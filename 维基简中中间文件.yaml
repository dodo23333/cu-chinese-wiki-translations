    会发出微光，比普通钟乳石更容易发现。</color>
  gunminedsc: |-
    <color=#888888>初始血量：</color><color=#88ff88>400</color>
    <color=#888888>机制：</color><color=#aaaaaa>被经过时向上发射子弹(开发中，未实装)</color>
    <color=#ffaa00>花絮：名称暗示曾有实验室人员因此受伤。</color>
  sawbladedsc: |-
    <color=#888888>初始血量：</color><color=#88ff88>400</color>
    <color=#888888>破坏掉落：</color><color=#aaaaaa>废金属x2 (100%)</color>

    <color=#ff4444>接触触发：
    ┃大量皮肤/肌肉伤害 | 重度出血
    ┃多次碰触易骨折 | 击飞并瘫倒
    ┃一秒内摧毁物品
    ┃徒手攻击模型无碰撞→布娃娃状态
    ┃(空手可快速拆掉锯片)</color>

    <color=#888888>肢体触碰(每次判定)：</color>
    <color=#ff4444>┃对躯体：+6休克值 | +80肾上腺素
    ┃布娃娃 | 掉毛发粒子 | 刺穿音效
    ┃对应肢体(均受护甲削减)：
    ┃皮肤-80 | 肌肉-30 | 流血+0.3~0.375
    ┃疼痛+80 | 穿戴物耐久-100%(×护甲削减比例)</color>
    <color=#888888>┃锯片自身：</color><color=#ff4444>耐久-10 | 耐久*=0.5</color>

    <color=#888888>来源层：</color><color=#aaaaaa>真菌池层(开发中未实装)</color>
    <color=#ffaa00>固定陷阱，持续发出噪音。远离即可。</color>
