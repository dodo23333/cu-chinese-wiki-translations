  gravbagdsc: |-
    ┃(装有物品时)腐败：<color=#ffaa00>-1%/分钟</color>
    ┃电池：<color=#88ccff>中型</color>
    ┃获取：<color=#aaaaaa>交易/生命舱箱/物资箱/空投舱</color>
    <color=#ff4444>爆炸：半径12格 ┃ 耳鸣30格</color>
