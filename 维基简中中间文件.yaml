    <color=#ffaa00>普通绷带的直接升级，附加消毒效果，满耐久可使用12圈，总计15分钟消毒时间。</color>
  plasticbandagedsc: |-
    ┃每一圈(共12圈)：
    ┃<color=#88ff88>皮肤 +5</color>
    ┃骨折 <color=#88ff88>-2.5%</color>
    ┃脱臼 <color=#88ff88>-2.5%</color>
    ┃出血 <color=#88ff88>-0.09L/分钟(在4.8秒内生效)</color>
    ┃疼痛 -8.33
    ┃消耗 8.33% 耐久
    ┃获取：<color=#aaaaaa>医疗箱/空投舱/生命舱箱子/交易</color>
    ┃制作(14)：1绷带(>=50%)+20mL生化流体+1钛板
    <color=#ffaa00>绷带的全面升级版，各项数值均更优，但重量也稍重(1u)。</color>
  adhesivebandagedsc: |-
    ┃外敷：
