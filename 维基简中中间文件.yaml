name: 维基中文
version: v1.7.5.7
extend_description: >-
  <color="orange">包含内华达刃脊锁补丁的多人联机汉化</color> ，
  并由 <color="yellow">维基中文制作组</color> 在此基础上扩展的功能性维基翻译补丁。
  <color="green">当前版本1.7.5(测试版2026-6-16)</color>；
  <color="blue">再次感谢简中版及内华达刃脊制作组。</color>
  <color="purple">所有数据信息均来自英文官方wiki和制作组解包数据，保证准确率高。</color>
  <color="red">Github上的该项目(更详细的信息)：https://github.com/StreamWind114514/scavprototype-- </color>，
  <color="orange">往后的更新及改动内容请前往Github查看。</color>
main:
  bandagedsc: |-
    ┃每一圈(共12圈)：
    ┃<color=#88ff88>皮肤 +2.5</color>
    ┃骨折 <color=#88ff88>-1.67%</color>
    ┃脱臼 <color=#88ff88>-1.67%</color>
    ┃出血 <color=#88ff88>-0.056L/分钟(3秒内生效)</color>
    ┃疼痛 -5
    ┃消耗 8.33% 耐久
    ┃获取：<color=#aaaaaa>医疗箱/空投舱/生命舱箱子/交易/地面刷新</color>
    ┃制作(5)：2撕裂的绷带(>=90%)
    <color=#ffaa00>1个帆布(可撕成1个撕裂绷带)重量仅0.1u，可随时合成绷带(0.9u)。</color>
  rippeddressingdsc: |-
    ┃每一圈(共8圈)：
    ┃<color=#88ff88>皮肤 +1</color>
    ┃骨折 <color=#88ff88>-0.63%</color>
    ┃脱臼 <color=#88ff88>-0.63%</color>
    ┃出血 <color=#88ff88>-0.034L/分钟(1.8秒内生效)</color>
    ┃疼痛 -5
    ┃消耗 12.5% 耐久
    ┃获取：<color=#aaaaaa>医疗箱/集装箱/空投舱/生命舱箱子/交易</color>
    ┃制作(0)：1(可撕碎) = 1撕裂的绷带
    <color=#ffaa00>2个>=90%的撕裂的绷带可合成1个绷带。
    帆布(0.1u)仅需3植物纤维，是最高效材料。</color>
  ragdsc: |-
    ┃在物品栏使用：
    ┃潮湿 -50% | 消耗 5% 耐久
    ┃每一圈(共8圈)：
    ┃<color=#88ff88>皮肤 +1</color>
    ┃骨折 <color=#88ff88>-0.63%</color>
    ┃脱臼 <color=#88ff88>-0.63%</color>
    ┃出血 <color=#88ff88>-0.019L/分钟(1秒内生效)</color>
    ┃疼痛 -3.13
    ┃消耗 12.5% 耐久
    ┃获取：<color=#aaaaaa>医疗箱/空投舱/生命舱箱子/交易</color>
    <color=#ffaa00>效果甚至不如撕裂的绷带，且不能用于制作。主要用于紧急擦干身体防止失温。</color>
