# See https://docs.astral.sh/uv/guides/integration/github/#multiple-python-versions
name: Merge Translations
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  merge-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run validate_data.py
        run: uv run merge-trans

      - name: Upload merged translation
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 维基简中
          path: 维基简中.json
          if-no-files-found: error
