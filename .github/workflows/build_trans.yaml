# See https://docs.astral.sh/uv/guides/integration/github/#multiple-python-versions
name: 构建翻译
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-translations:
    runs-on: ubuntu-latest

    steps:
      - name: 设置构建目录
        run: echo "TRANSLATION_BUILD_DIR=$RUNNER_TEMP/wiki-translations" >> "$GITHUB_ENV"

      - name: 拉取项目
        uses: actions/checkout@v6.0.3
        with:
          submodules: true

      - name: 拉取最新官方翻译
        run: git submodule update --init --recursive --remote

      - name: 安装uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: 设置Python
        run: uv python install

      - name: 安装环境
        run: uv sync --locked --all-extras --dev

      - name: 运行测试和覆盖率
        run: uv run pytest --cov=cu_chinese_wiki_translations --cov-report=term-missing

      - name: 生成覆盖率评论
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
        env:
          GIT_CONFIG_PARAMETERS: "'core.quotePath=false'"

      - name: 合并官方翻译
        run: |
          mkdir -p "$TRANSLATION_BUILD_DIR"
          uv run merge-trans -o "$TRANSLATION_BUILD_DIR/wiki-translations-official.json" --build-info "$TRANSLATION_BUILD_DIR/build-info.md"
          cat "$TRANSLATION_BUILD_DIR/build-info.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 读取翻译版本号
        id: translation-version
        run: |
          version="$(uv run python -c 'import yaml; print(yaml.safe_load(open("维基中文中间文件.yaml", encoding="utf-8"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 附加版本号到产物文件名
        run: |
          mv "$TRANSLATION_BUILD_DIR/wiki-translations-official.json" "$TRANSLATION_BUILD_DIR/wiki-translations-official-${{ steps.translation-version.outputs.version }}.json"

      - name: 上传维基中文_基于官方翻译
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wiki-translations-official-${{ steps.translation-version.outputs.version }}
          path: |
            ${{ env.TRANSLATION_BUILD_DIR }}/wiki-translations-official-${{ steps.translation-version.outputs.version }}.json
            ${{ env.TRANSLATION_BUILD_DIR }}/build-info.md
          if-no-files-found: error

      - name: 整理发布说明
        if: github.ref_type == 'tag'
        run: |
          uv run python <<'PY'
          import os
          from pathlib import Path

          build_dir = Path(os.environ["TRANSLATION_BUILD_DIR"])
          notes_path = Path("docs/release-notes.md")
          notes = notes_path.read_text(encoding="utf-8") if notes_path.is_file() else ""
          header, _, body = notes.partition("\n")
          tag = os.environ["GITHUB_REF_NAME"]
          if header.strip() == f"<!-- release-tag: {tag} -->" and body.strip():
              introduction = body.strip() + "\n\n"
              print(f"加入 {tag} 的人工公告正文")
          else:
              introduction = ""
              print(f"跳过人工公告：没有适用于 {tag} 的正文；保留构建信息和自动更新记录")
          build_info = (build_dir / "build-info.md").read_text(encoding="utf-8")
          (build_dir / "release-notes.md").write_text(introduction + build_info, encoding="utf-8")
          PY

      - name: 自动发布Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          preserve_order: true
          files: |
            ${{ env.TRANSLATION_BUILD_DIR }}/wiki-translations-official-${{ steps.translation-version.outputs.version }}.json
          body_path: ${{ env.TRANSLATION_BUILD_DIR }}/release-notes.md
          generate_release_notes: true
