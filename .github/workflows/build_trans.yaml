# See https://docs.astral.sh/uv/guides/integration/github/#multiple-python-versions
name: 构建翻译
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-translations:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取项目
        uses: actions/checkout@v6.0.3
        with:
          submodules: true

      - name: 安装uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: 设置Python
        run: uv python install

      - name: 安装环境
        run: uv sync --locked --all-extras --dev

      - name: 运行测试和覆盖率
        run: uv run pytest --cov=cu_chinese_wiki_translations --cov-report=term-missing

      - name: 生成覆盖率评论
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 拉取最新官方翻译
        run: git submodule update --init --recursive --remote

      - name: 合并官方翻译
        run: uv run merge-trans

      - name: 合并软盘翻译
        run: uv run merge-trans -v 基准汉化_软盘.json -o 维基中文_基于软盘翻译.json

      - name: 读取翻译版本号
        id: translation-version
        run: |
          version="$(uv run python -c 'import yaml; print(yaml.safe_load(open("维基中文中间文件.yaml", encoding="utf-8"))["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 附加版本号到产物文件名
        run: |
          mv 维基中文_基于官方翻译.json "维基中文_基于官方翻译${{ steps.translation-version.outputs.version }}.json"
          mv 维基中文_基于软盘翻译.json "维基中文_基于软盘翻译${{ steps.translation-version.outputs.version }}.json"

      - name: 上传维基中文_基于官方翻译
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 维基中文_基于官方翻译${{ steps.translation-version.outputs.version }}
          path: 维基中文_基于官方翻译${{ steps.translation-version.outputs.version }}.json
          if-no-files-found: error

      - name: 上传维基中文_基于软盘翻译
        uses: actions/upload-artifact@v7.0.1
        with:
          name: 维基中文_基于软盘翻译${{ steps.translation-version.outputs.version }}
          path: 维基中文_基于软盘翻译${{ steps.translation-version.outputs.version }}.json
          if-no-files-found: error

      # 同时上传两个中文名文件会报错，暂时先传一个
      - name: 自动发布Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          preserve_order: true
          files: |
            维基中文_基于官方翻译${{ steps.translation-version.outputs.version }}.json
          generate_release_notes: true
