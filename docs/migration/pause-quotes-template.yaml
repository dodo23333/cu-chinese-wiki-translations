# 暂停提示分组骨架，可整份粘贴到“维基中文中间文件.yaml”末尾。
# 对照正式版中文填写每组完整列表，再取消根键和已完成分组的注释。
# 未完成的组保持注释；每组列表会整体替换上游内容，不要只填新增提示。
# 下方“填写……”是占位文字，启用前须替换。可重复 - |- 块添加提示。
# 分组参考公开 release/EN.json；另两组剧透占位符待实际上游内容公开后再补。

