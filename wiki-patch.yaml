    - |-
      他们并不知道你在做这件事。

      <size=60%><color=#84D6FF>丢越重的东西，带来的反推力越大。

      对地面丢迷你罐可以让exp飞起来，

      借助这点可以让我们跳到更远的地方</color></size>
    - |-
      懒鬼。

      <size=60%><color=#84D6FF>静脉输液袋

      是游戏内可制作的最优性价比的液体容器</color></size>
    - |-
      在吗！

      <size=60%><color=#84D6FF>长老转阶段具有一定延迟

      如果只想打跑长老，记得及时收手</color></size>
    - |-
      寂静总是有代价的。

