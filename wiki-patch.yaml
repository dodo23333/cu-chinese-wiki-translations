  char1quirks: |-
    !R![嗜睡体质] —— 你的睡眠周期要短的多，但睡在粗糙的地面上不会对你产生负面影响。
    [身材矮小] —— 你体型小巧！
    [夜视适应] —— 你的视觉更强，对光照的敏感度更高。
    [半步素食] —— 肉类食物会让你略感恶心，营养价值也更低。
    [体质羸弱] —— 所有力量和韧性经验获取减半。
    [枪械精通] —— 你可以使用霰弹盒给霰弹枪装弹，还能使用快捷键操作枪械，并查看弹匣余弹量。
    [铁壁心防] —— 你的心智更加坚韧。除非必要，否则你不会轻易的表露自己的感情。
    [犬科烙印] —— 你的胃难以容忍可可碱。
