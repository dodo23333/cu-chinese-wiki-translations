  mercnote1: |-
    !R!最后几层阻碍你的砾石与岩层在眼前碎裂，你终于触及了那片广袤的天穹。<>

    你跨过刀山火海，穿过无边炼狱，越过了成千上万的——那些曾是你同胞的——尸骸，成为第一个，也是唯一的一个完成任务的人...
    ...然而，你却觉得，这不过是另一段更为宏大的征程的开端。<>

    你已破土而出，抵达地表。踏上灰星冰冷的地面，地平线上，建筑、山峦与人群隐约浮现。
pauseQuotes:
  normal:
    - |-
      已暂停。

      <size=60%><color=#84D6FF>如果你不想被地雷炸伤就扑倒在其他地方

      地雷检测范围比他自己高一点

      比他矮的东西那就炸不到了</color></size>
    - |-
      这就休息了？

      <size=60%><color=#84D6FF>吗啡注射器可以用来给液体抬价+9</color></size>
    - |-
      累了吗？

      <size=60%><color=#84D6FF>伤口黏合剂因代码问题

      稀释后按几毫升使用可以起到镇痛作用</color></size>
    - |-
      时间已停止。

      <size=60%><color=#84D6FF>如果你不想当蛞蝓猫的话，

      自动跳跃在“设置—操作”里</color></size>
    - |-
      我会等着的。

      <size=60%><color=#84D6FF>750mL的生理盐水

      可解决不算太严重的肺栓塞</color></size>
    - |-
      正在等你。

      <size=60%><color=#84D6FF>截肢头部不会致死

      游戏本身没有头无即死判定</color></size>
    - |-
      嘿！

      <size=60%><color=#91a7ff>你可以将小电池装进本不属于它的电器，

      原价卖给商人</color></size>
    - |-
      “离开时帮我带瓶汽水呗？”

      <size=60%><color=#84D6FF>物品可从附近地面或容器中

      直接拖到医疗面板使用</color></size>
    - |-
      于是，时间陷入停滞...

      <size=60%><color=#84D6FF>布娃娃时不会触发玻璃碎片</color></size>
    - |-
      时间不再走动。

      <size=60%><color=#84D6FF>荧光藻会快速感染地下水</color></size>
    - |-
      让我们暂停片刻。

      <size=60%><color=#84D6FF>生理盐水比直接输血更加有效</color></size>
    - |-
